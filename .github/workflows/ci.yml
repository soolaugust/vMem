name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build hatchling pytest mcp
      - name: Static validation
        run: |
          python -m json.tool hooks/hooks.json >/dev/null
          python -m py_compile \
            memory_os/cli/mcp_memory_lookup.py memory_os/cli/vmem_doctor.py memory_os/observability/production_assertions.py \
            hooks/context_governor.py hooks/prompt_budget_guard.py hooks/transcript_reclaimer.py \
            hooks/retriever.py hooks/retriever_daemon.py
      - name: Unit and e2e tests
        run: |
          python -m pytest \
            tests/test_vmem_doctor.py \
            tests/test_context_400_e2e.py \
            tests/test_transcript_reclaimer.py \
            tests/test_production_benchmark.py \
            hooks/test_context_governor.py \
            hooks/test_prompt_budget_guard.py -q
      - name: Production benchmark smoke
        run: |
          python benchmarks/production/runner.py --suite smoke --fail-under 85 --report /tmp/vmem-benchmark.json --markdown /tmp/vmem-benchmark.md
      - name: Doctor smoke
        run: |
          MEMORY_OS_DIR=$(mktemp -d) python -m memory_os.cli.mcp_memory_lookup doctor --json
      - name: Build and install wheel
        run: |
          python -m build --wheel --no-isolation
          python -m venv /tmp/vmem-install
          /tmp/vmem-install/bin/python -m pip install dist/vmem-0.1.0-py3-none-any.whl
          MEMORY_OS_DIR=$(mktemp -d) /tmp/vmem-install/bin/vmem doctor --json
      - name: Public hygiene scan
        run: |
          python - <<'PY'
          from pathlib import Path
          patterns = ("xiao" + "mi", "git.n." + "xiao" + "mi", "@" + "xiao" + "mi", "kernel-cpu/" + "aios")
          roots = [Path(p) for p in [
              "README.md", "README.zh.md", "llms.txt", "docs", "marketing", "paper/main.tex",
              "pyproject.toml", "glama.json", ".mcp.json", "hooks/hooks.json",
              "memory_os/cli/vmem_doctor.py", "tests/test_vmem_doctor.py", "memory_os/observability/production_assertions.py", ".github/workflows/ci.yml",
          ]]
          hits = []
          for root in roots:
              paths = root.rglob("*") if root.is_dir() else [root]
              for path in paths:
                  if path.is_file() and path.suffix.lower() not in {".pdf", ".deb", ".aux", ".out", ".blg"}:
                      text = path.read_text(encoding="utf-8", errors="ignore").lower()
                      if any(pattern in text for pattern in patterns):
                          hits.append(str(path))
          if hits:
              raise SystemExit("internal strings found: " + ", ".join(hits))
          PY
