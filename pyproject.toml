[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vmem"
version = "0.1.0"
description = "OS-managed context for AI agents — demand paging, pinning, and reclaim for LLM working sets"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "soolaugust", email = "soolaugust@gmail.com" },
]
keywords = ["memory", "mcp", "claude", "agent", "persistence", "context"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.0",
]

[project.urls]
Homepage = "https://github.com/soolaugust/vMem"
Repository = "https://github.com/soolaugust/vMem"
Issues = "https://github.com/soolaugust/vMem/issues"

[project.scripts]
vmem = "mcp_memory_lookup:main"
memory-os = "mcp_memory_lookup:main"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = [
    "mcp_memory_lookup.py",
    "vmem_doctor.py",
    "store_vfs.py",
    "store_vfs_schema.py",
    "store_vfs_effects_new.py",
    "scorer.py",
    "bm25.py",
    "config.py",
    "utils.py",
    "schema.py",
    "hooks/hooks.json",
    "hooks/context_governor.py",
    "hooks/prompt_budget_guard.py",
    "hooks/retriever.py",
    "hooks/retriever_daemon.py",
    "hooks/retriever_wrapper.sh",
]
