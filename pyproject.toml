[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vmem"
version = "0.1.0"
description = "OS-managed context for AI agents — demand paging, pinning, and reclaim for LLM working sets"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "soolaugust", email = "soolaugust@gmail.com" },
]
keywords = ["memory", "mcp", "claude", "agent", "persistence", "context"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.0",
]

[project.urls]
Homepage = "https://github.com/soolaugust/vMem"
Repository = "https://github.com/soolaugust/vMem"
Issues = "https://github.com/soolaugust/vMem/issues"

[project.scripts]
vmem = "memory_os.cli.mcp_memory_lookup:main"
memory-os = "memory_os.cli.mcp_memory_lookup:main"

[tool.hatch.build.targets.wheel]
packages = ["."]
# Implementation lives under memory_os/; project root contains packaging/docs only.
only-include = [
    "memory_os",
    "hooks",
    "tools",
    "README.md",
    "README.zh.md",
    "docs",
]
